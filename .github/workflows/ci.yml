name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any in-progress run on the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test deps
        # Deliberately avoiding the [all] extra: that pulls openai-whisper
        # which transitively installs torch (~1GB) and explodes CI time.
        # The fast suite uses cloud SDK clients, Textual, pyyaml, and dev tools.
        # Whisper remains lazy, so torch is not required for UI smoke tests.
        run: |
          python -m pip install --upgrade pip
          pip install \
            pyyaml \
            "textual>=8,<9" \
            openai \
            anthropic \
            openrouter \
            pytest \
            pytest-asyncio \
            ruff

      - name: Lint (ruff)
        run: ruff check meeting_notes/ tests/

      - name: Test (pytest, fast tests only)
        # Explicitly listing the test files keeps CI green even if someone
        # later adds a new test file with heavy dependencies.
        # The new audio/transcriber tests deliberately avoid importing torch
        # (transcriber.py imports whisper lazily inside load_model, and the
        # tests inject a fake whisper module via sys.modules), so they're
        # safe to run on the lightweight CI image.
        run: |
          pytest -v \
            tests/test_config.py \
            tests/test_paths_and_fallbacks.py \
            tests/test_summarizers.py \
            tests/test_recorder_commands.py \
            tests/test_device_enumeration.py \
            tests/test_transcriber_device.py \
            tests/test_level_meter.py \
            tests/test_audio_test.py \
            tests/test_mix_gains.py \
            tests/test_setup_health.py \
            tests/test_meeting_routing.py \
            tests/test_desktop_integration.py \
            tests/test_logging_security.py \
            tests/test_textual_smoke.py
